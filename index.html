// ─── Mini Chart ───────────────────────────────────────────────────────────
function BarChart({data,labels}){
  const max=Math.max(...data);
  return(
    <div style={{display:'flex',alignItems:'flex-end',gap:8,height:120,padding:'0 0 20px'}}>
      {data.map((v,i)=>(
        <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-end',height:'100%'}}>
          <div style={{width:'100%',background:COLORS.blue,borderRadius:'4px 4px 0 0',height:`${(v/max)*90}%`,opacity:0.85,transition:'height .3s'}}/>
          <div style={{fontSize:10,color:COLORS.textMuted,marginTop:4}}>{labels[i]}</div>
        </div>
      ))}
    </div>
  );
}

function LineChart({data,labels}){
  const max=Math.max(...data),min=Math.min(...data);
  const H=120,W=400;
  const pts=data.map((v,i)=>[i*(W/(data.length-1)),(1-(v-min)/(max-min))*(H-20)+10]);
  const d='M'+pts.map(p=>p.join(',')).join(' L');
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:140}}>
      <defs>
        <linearGradient id="lg" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor={COLORS.blue} stopOpacity=".2"/>
          <stop offset="100%" stopColor={COLORS.blue} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={`${d} L${pts[pts.length-1][0]},${H} L0,${H} Z`} fill="url(#lg)"/>
      <path d={d} fill="none" stroke={COLORS.blue} strokeWidth="2.5" strokeLinejoin="round"/>
      {pts.map((p,i)=>(
        <g key={i}>
          <circle cx={p[0]} cy={p[1]} r="4" fill={COLORS.blue}/>
          <text x={p[0]} y={H} textAnchor="middle" fontSize="9" fill={COLORS.textMuted}>{labels[i]}</text>
        </g>
      ))}
    </svg>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────
function App(){
  const [auth,setAuth]=useState(null);
  const [page,setPage]=useState(null);
  const [booked,setBooked]=useState(false);

  const handleLogin=(role)=>{
    setAuth(role);
    const defPages={Manajer:'dashboard',Pelayan:'order-mgmt',Kasir:'payments',Publik:'reserve'};
    setPage(defPages[role]);
  };

  const handleLogout=()=>{setAuth(null);setPage(null);setBooked(false);};

  if(!auth) return <Login onLogin={handleLogin}/>;

  if(auth==='Publik'){
    if(booked) return <BookingSuccess onBack={()=>setBooked(false)}/>;
    return <PublicReserve onBook={()=>setBooked(true)}/>;
  }

  const userName={Manajer:'Andi Pratama',Pelayan:'Budi Santoso',Kasir:'Kasir'}[auth]||'User';
  const renderPage=()=>{
    const pages={
      dashboard:<Dashboard/>,orders:<Orders/>,reservations:<Reservations/>,sales:<SalesReport/>,
      'order-mgmt':<OrderManagement/>,
      'order-status':<OrderStatus/>,
      'order-history':<OrderHistoryPage/>,
      payments:(
        <div style={s.content}><div style={{...s.grid2,gridTemplateColumns:'1fr 1fr'}}></div>
        <CashierPayments/></div>
      ),
      'reservations-cashier':<CashierReservations/>,
      'customer-checkin':<CustomerCheckin/>,
    };
    return pages[page]||<Dashboard/>;
  };

  return(
    <div style={{display:'flex'}}>
      <Sidebar role={auth} page={page} setPage={setPage} onLogout={handleLogout}/>
      <div style={s.main}>
        <Topbar role={auth} page={page} userName={userName}/>
        {page==='payments'?(
          <div style={s.content}><CashierPayments/></div>
        ):renderPage()}
      </div>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
